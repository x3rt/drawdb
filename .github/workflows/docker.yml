name: Docker Build and Push

on:
  push:
    tags:
      - "*"

permissions:
  packages: write

concurrency:
  group: "docker-image"
  cancel-in-progress: false

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push amd64
      id: build
      uses: docker/build-push-action@v6
      with:
        push: true
        platforms: linux/amd64
        tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push arm64
      id: build
      uses: docker/build-push-action@v6
      with:
        push: true
        platforms: linux/arm64
        tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest

    steps:
    - name: Log in to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
          -t ghcr.io/${{ github.repository }}:latest \
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64 \
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64